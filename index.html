<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>口语问答自测</title>
<style>
  :root{
    --bg:#FFFFFF;
    --panel:#FFFFFF;
    --panel-hi:#F4F6F7;
    --line:#E3E7EA;
    --ink:#1C2126;
    --ink-dim:#78828B;
    --amber:#CC7A2E;
    --amber-dim:#D8AE7C;
    --teal:#1E9B76;
    --red:#D9503F;
    --story:#2E6FCC;
    --dafa:#B0642F;
    --font-display: Georgia, 'Songti SC', 'Noto Serif SC', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'SF Mono', 'Consolas', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#FCFDFD;
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    padding:32px 16px 80px;
  }
  .wrap{max-width:980px;margin:0 auto;}

  header{margin-bottom:22px;}
  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.18em;
    color:var(--amber);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  h1{
    font-family:var(--font-display);
    font-size:30px;
    font-weight:600;
    margin:0 0 6px;
    letter-spacing:.01em;
  }
  .sub{color:var(--ink-dim);font-size:13.5px;line-height:1.6;}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 1px 2px rgba(28,33,38,0.03), 0 6px 20px rgba(28,33,38,0.04);
  }
  .card h2{
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin:0 0 14px;
  }

  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .row.between{justify-content:space-between;}

  button{
    font-family:var(--font-body);
    font-size:14px;
    font-weight:600;
    padding:9px 16px;
    border-radius:8px;
    border:1px solid transparent;
    cursor:pointer;
    transition:transform .1s ease, opacity .15s ease;
  }
  button:active{transform:scale(.97);}
  button:disabled{opacity:.35;cursor:not-allowed;}

  .btn-primary{background:var(--amber);color:#FFFFFF;}
  .btn-primary:hover:not(:disabled){opacity:.9;}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--ink);font-size:13px;padding:7px 12px;}
  .btn-ghost:hover:not(:disabled){border-color:var(--amber-dim);}
  .btn-icon{
    background:var(--panel-hi);
    border-color:var(--line);
    color:var(--ink);
    width:44px;height:44px;
    border-radius:50%;
    font-size:17px;
    display:flex;align-items:center;justify-content:center;
    padding:0;
  }
  .btn-icon:hover:not(:disabled){border-color:var(--amber-dim);}
  .btn-mic{
    background:var(--panel-hi);
    border-color:var(--line);
    color:var(--ink);
    width:64px;height:64px;
    border-radius:50%;
    font-size:22px;
    display:flex;align-items:center;justify-content:center;
    padding:0;
  }
  .btn-mic.listening{
    background:var(--red);
    border-color:var(--red);
    color:#FFFFFF;
    box-shadow:0 0 0 6px rgba(217,80,63,0.14);
  }
  .btn-mic.speaking{
    background:var(--teal);
    border-color:var(--teal);
    color:#FFFFFF;
  }

  select{
    background:var(--panel-hi);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:6px;
    font-family:var(--font-mono);
    font-size:12px;
    padding:6px 8px;
  }

  /* 双题库两栏 */
  .banks{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  @media (max-width:640px){
    .banks{grid-template-columns:1fr;}
  }
  .bank-col{
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .bank-head{
    padding:12px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .bank-title{
    font-family:var(--font-display);
    font-size:17px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .bank-col.story .dot{background:var(--story);}
  .bank-col.dafa .dot{background:var(--dafa);}
  .bank-count{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--ink-dim);
  }
  .bank-list{
    max-height:340px;
    overflow-y:auto;
    padding:6px;
  }
  .qitem{
    display:flex;
    gap:8px;
    align-items:flex-start;
    padding:9px 10px;
    border-radius:8px;
    cursor:pointer;
    font-size:13.5px;
    line-height:1.5;
    color:var(--ink);
  }
  .qitem:hover{background:var(--panel-hi);}
  .qitem.active{
    background:var(--panel-hi);
    box-shadow:inset 3px 0 0 var(--amber);
    font-weight:600;
  }
  .qitem .qi-num{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--ink-dim);
    min-width:22px;
    padding-top:1px;
  }
  .qitem.visited .qi-num{color:var(--teal);}
  .qitem.visited::after{content:'✓';color:var(--teal);font-size:11px;margin-left:auto;padding-top:2px;}

  /* 作答区 */
  .empty{
    text-align:center;
    padding:36px 12px;
    color:var(--ink-dim);
    font-size:14px;
  }
  .qbox{display:none;}
  .qmeta{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--ink-dim);
    letter-spacing:.08em;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .qmeta .tag{
    padding:2px 8px;
    border-radius:20px;
    font-size:10px;
    color:#fff;
  }
  .qmeta .tag.story{background:var(--story);}
  .qmeta .tag.dafa{background:var(--dafa);}
  .question-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
  }
  .question{
    font-family:var(--font-display);
    font-size:21px;
    line-height:1.5;
    color:var(--ink);
    margin-bottom:4px;
    flex:1;
  }
  .mic-area{
    display:flex;
    align-items:center;
    gap:18px;
    margin:20px 0 6px;
  }
  .waveform{
    display:flex;
    align-items:center;
    gap:3px;
    height:36px;
    flex:1;
  }
  .waveform span{
    display:block;
    width:4px;
    border-radius:2px;
    background:var(--line);
    height:6px;
    transition:height .1s ease, background .15s ease;
  }
  .waveform.active span{background:var(--red);}
  .mic-label{font-size:12px;color:var(--ink-dim);font-family:var(--font-mono);}
  textarea{
    width:100%;
    background:var(--panel-hi);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--ink);
    font-family:var(--font-mono);
    font-size:13px;
    padding:12px;
    resize:vertical;
    line-height:1.6;
  }
  #transcript{min-height:70px;margin-top:6px;}

  .stats{
    display:flex;
    gap:18px;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--ink-dim);
  }
  .stats b{color:var(--amber);font-size:15px;font-family:var(--font-body);}

  .warn{
    background:rgba(217,80,63,0.06);
    border:1px solid rgba(217,80,63,0.25);
    color:#A83E2F;
    font-size:12.5px;
    padding:10px 12px;
    border-radius:8px;
    margin-top:10px;
    line-height:1.6;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Oral Quiz Trainer</div>
    <h1>口语问答自测</h1>
    <div class="sub">分别点击「故事」或「大法」题库里的任意一题 → 系统语音播报题目 → 对着麦克风口头回答，练习你的表达。</div>
  </header>

  <!-- 双题库 -->
  <div class="card">
    <div class="row between" style="margin-bottom:14px;">
      <h2 style="margin:0;">题库</h2>
      <div class="row">
        <select id="langSelect">
          <option value="zh-CN">中文</option>
          <option value="en-US">English</option>
        </select>
        <button class="btn-ghost" id="ttsToggleBtn">🔊 语音播报：开</button>
      </div>
    </div>
    <div class="banks">
      <div class="bank-col story">
        <div class="bank-head">
          <div class="bank-title"><span class="dot"></span>故事</div>
          <div class="row">
            <span class="bank-count" id="storyCount"></span>
            <button class="btn-ghost" id="storyRandomBtn">🔀 随机</button>
          </div>
        </div>
        <div class="bank-list" id="storyList"></div>
      </div>
      <div class="bank-col dafa">
        <div class="bank-head">
          <div class="bank-title"><span class="dot"></span>大法</div>
          <div class="row">
            <span class="bank-count" id="dafaCount"></span>
            <button class="btn-ghost" id="dafaRandomBtn">🔀 随机</button>
          </div>
        </div>
        <div class="bank-list" id="dafaList"></div>
      </div>
    </div>
  </div>

  <!-- 作答区 -->
  <div class="card">
    <div class="row between">
      <h2 style="margin:0;">作答</h2>
      <div class="stats" id="statsBar"></div>
    </div>

    <div class="empty" id="emptyState">从上面「故事」或「大法」题库里点一道题开始。</div>

    <div class="qbox" id="qbox">
      <div class="qmeta" id="qmeta"></div>
      <div class="question-row">
        <div class="question" id="questionText"></div>
        <button class="btn-icon" id="replayBtn" title="重新播报题目">🔊</button>
      </div>

      <div class="mic-area">
        <button class="btn-mic" id="micBtn" title="按下开始/停止录音">🎤</button>
        <div class="waveform" id="waveform"></div>
      </div>
      <div class="mic-label" id="micLabel">题目播报完毕后，点击麦克风开始口语作答</div>

      <textarea id="transcript" rows="3" placeholder="你说的内容会实时转成文字显示在这里，仅供自己回顾，不会打分…"></textarea>

      <div id="speechWarn" class="warn" style="display:none;">
        当前浏览器不支持语音识别（建议使用 Chrome）。语音播报题目功能不受影响。
      </div>
    </div>
  </div>

</div>

const TOTAL = STORY_QUESTIONS.length + DAFA_QUESTIONS.length;

let current = null; // {cat:'story'|'dafa', idx:number}
let visitedStory = new Set();
let visitedDafa = new Set();
let recognition = null;
let listening = false;
let waveformInterval = null;
let ttsEnabled = true;

// ---------- 渲染两个题库列表 ----------
function renderList(containerId, questions, cat) {
  const el = $(containerId);
  el.innerHTML = '';
  questions.forEach((q, idx) => {
    const item = document.createElement('div');
    item.className = 'qitem';
    item.dataset.cat = cat;
    item.dataset.idx = idx;
    item.innerHTML = `<span class="qi-num">${idx + 1}</span><span>${escapeHtml(q)}</span>`;
    item.addEventListener('click', () => selectQuestion(cat, idx));
    el.appendChild(item);
  });
}
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

renderList('storyList', STORY_QUESTIONS, 'story');
renderList('dafaList', DAFA_QUESTIONS, 'dafa');
$('storyCount').textContent = `共 ${STORY_QUESTIONS.length} 题`;
$('dafaCount').textContent = `共 ${DAFA_QUESTIONS.length} 题`;

// ---------- 选题 ----------
function selectQuestion(cat, idx) {
  current = { cat, idx };
  const list = cat === 'story' ? STORY_QUESTIONS : DAFA_QUESTIONS;
  const visited = cat === 'story' ? visitedStory : visitedDafa;
  visited.add(idx);

  // 更新高亮
  document.querySelectorAll('.qitem').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.qitem').forEach(el => {
    const c = el.dataset.cat, i = Number(el.dataset.idx);
    const v = c === 'story' ? visitedStory : visitedDafa;
    el.classList.toggle('visited', v.has(i));
  });
  const activeEl = document.querySelector(`.qitem[data-cat="${cat}"][data-idx="${idx}"]`);
  if (activeEl) {
    activeEl.classList.add('active');
    activeEl.scrollIntoView({ block: 'nearest' });
  }

  const text = list[idx];
  $('questionText').textContent = text;
  const tagLabel = cat === 'story' ? '故事' : '大法';
  $('qmeta').innerHTML = `<span class="tag ${cat}">${tagLabel}</span>第 ${idx + 1} 题 / 共 ${list.length} 题`;
  $('transcript').value = '';
  $('emptyState').style.display = 'none';
  $('qbox').style.display = 'block';
  updateStats();
  stopListening();
  speakQuestion(text);
}

$('storyRandomBtn').addEventListener('click', () => {
  if (STORY_QUESTIONS.length === 0) return;
  let idx = Math.floor(Math.random() * STORY_QUESTIONS.length);
  if (STORY_QUESTIONS.length > 1 && current && current.cat === 'story') {
    while (idx === current.idx) idx = Math.floor(Math.random() * STORY_QUESTIONS.length);
  }
  selectQuestion('story', idx);
});
$('dafaRandomBtn').addEventListener('click', () => {
  if (DAFA_QUESTIONS.length === 0) return;
  let idx = Math.floor(Math.random() * DAFA_QUESTIONS.length);
  if (DAFA_QUESTIONS.length > 1 && current && current.cat === 'dafa') {
    while (idx === current.idx) idx = Math.floor(Math.random() * DAFA_QUESTIONS.length);
  }
  selectQuestion('dafa', idx);
});
$('replayBtn').addEventListener('click', () => {
  if (current) {
    const list = current.cat === 'story' ? STORY_QUESTIONS : DAFA_QUESTIONS;
    speakQuestion(list[current.idx]);
  }
});

function updateStats() {
  const visitedTotal = visitedStory.size + visitedDafa.size;
  $('statsBar').innerHTML = `<span><b>${visitedTotal}</b> / ${TOTAL} 已练习</span><span><b>${visitedStory.size}</b> 故事</span><span><b>${visitedDafa.size}</b> 大法</span>`;
}
updateStats();

// ---------- 语音播报（TTS，优先选女声） ----------
let voicesCache = [];
function loadVoices() {
  voicesCache = window.speechSynthesis.getVoices();
}
if ('speechSynthesis' in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function pickFemaleVoice(lang) {
  const prefix = lang.split('-')[0].toLowerCase();
  const candidates = voicesCache.filter(v => v.lang && v.lang.toLowerCase().startsWith(prefix));
  const femaleHint = /female|女声|婷婷|晓晓|晓伊|瑶瑶|慧慧|静|Ting-?Ting|Mei-?Jia|Xiaoxiao|Yaoyao|Huihui|Zira|Samantha|Susan|Karen|Moira|Tessa|Fiona|Google.*(US|UK|普通话|國語).*Female/i;
  return candidates.find(v => femaleHint.test(v.name)) || candidates[0] || null;
}

function speakQuestion(text) {
  if (!ttsEnabled) {
    $('micLabel').textContent = '语音播报已关闭 · 点击麦克风开始口语作答';
    return;
  }
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = $('langSelect').value;
  const voice = pickFemaleVoice(utter.lang);
  if (voice) utter.voice = voice;
  utter.pitch = 1.05;
  utter.rate = 0.8;
  $('micBtn').disabled = true;
  $('replayBtn').classList.add('speaking');
  $('micLabel').textContent = '🔊 正在播报题目…';
  utter.onend = () => {
    $('micBtn').disabled = false;
    $('replayBtn').classList.remove('speaking');
    $('micLabel').textContent = '点击麦克风开始口语作答';
  };
  utter.onerror = () => {
    $('micBtn').disabled = false;
    $('replayBtn').classList.remove('speaking');
    $('micLabel').textContent = '点击麦克风开始口语作答';
  };
  window.speechSynthesis.speak(utter);
}

$('ttsToggleBtn').addEventListener('click', () => {
  ttsEnabled = !ttsEnabled;
  $('ttsToggleBtn').textContent = ttsEnabled ? '🔊 语音播报：开' : '🔇 语音播报：关';
  if (!ttsEnabled && 'speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    $('micBtn').disabled = false;
    $('replayBtn').classList.remove('speaking');
    $('micLabel').textContent = '语音播报已关闭 · 点击麦克风开始口语作答';
  }
});
$('langSelect').addEventListener('change', () => {
  if (recognition) recognition.lang = $('langSelect').value;
});

// ---------- 语音识别（听写作答） ----------
const waveEl = $('waveform');
for (let i = 0; i < 28; i++) {
  const bar = document.createElement('span');
  waveEl.appendChild(bar);
}

function setupRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    $('speechWarn').style.display = 'block';
    $('micBtn').disabled = true;
    return;
  }
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = $('langSelect').value;

  recognition.onresult = (event) => {
    let finalText = '';
    let interimText = '';
    for (let i = 0; i < event.results.length; i++) {
      const t = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalText += t;
      else interimText += t;
    }
    $('transcript').value = (finalText + ' ' + interimText).trim();
  };
  recognition.onerror = (e) => {
    $('micLabel').textContent = '识别出错（' + e.error + '）';
    stopListening();
  };
  recognition.onend = () => {
    if (listening) {
      try { recognition.start(); } catch (e) { stopListening(); }
    }
  };
}
setupRecognition();

function startListening() {
  if (!recognition) return;
  listening = true;
  $('micBtn').classList.add('listening');
  $('micBtn').textContent = '⏹';
  $('micLabel').textContent = '正在聆听… 再次点击停止';
  waveEl.classList.add('active');
  waveformInterval = setInterval(() => {
    waveEl.querySelectorAll('span').forEach(s => {
      s.style.height = (listening ? (4 + Math.random() * 28) : 6) + 'px';
    });
  }, 120);
  try { recognition.start(); } catch (e) {}
}
function stopListening() {
  listening = false;
  $('micBtn').classList.remove('listening');
  $('micBtn').textContent = '🎤';
  waveEl.classList.remove('active');
  clearInterval(waveformInterval);
  waveEl.querySelectorAll('span').forEach(s => s.style.height = '6px');
  if (recognition) { try { recognition.stop(); } catch (e) {} }
}
$('micBtn').addEventListener('click', () => {
  if (listening) stopListening(); else startListening();
});
</script>
