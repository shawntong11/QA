<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>口语问答自测</title>
<style>
  :root{
    --bg:#FFFFFF;
    --panel:#FFFFFF;
    --panel-hi:#F4F6F7;
    --line:#E3E7EA;
    --ink:#1C2126;
    --ink-dim:#78828B;
    --amber:#CC7A2E;
    --amber-dim:#D8AE7C;
    --teal:#1E9B76;
    --red:#D9503F;
    --font-display: Georgia, 'Songti SC', 'Noto Serif SC', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'SF Mono', 'Consolas', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#FCFDFD;
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    padding:32px 16px 80px;
  }
  .wrap{max-width:720px;margin:0 auto;}

  header{margin-bottom:28px;}
  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.18em;
    color:var(--amber);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  h1{
    font-family:var(--font-display);
    font-size:32px;
    font-weight:600;
    margin:0 0 6px;
    letter-spacing:.01em;
  }
  .sub{color:var(--ink-dim);font-size:14px;line-height:1.6;}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px;
    margin-bottom:18px;
    box-shadow:0 1px 2px rgba(28,33,38,0.03), 0 6px 20px rgba(28,33,38,0.04);
  }
  .card h2{
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin:0 0 14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card h2 .n{color:var(--amber);}

  textarea{
    width:100%;
    background:var(--panel-hi);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--ink);
    font-family:var(--font-mono);
    font-size:13px;
    padding:12px;
    resize:vertical;
    line-height:1.6;
  }
  textarea::placeholder{color:#A8B0B8;}

  .hint{font-size:12px;color:var(--ink-dim);margin-top:8px;line-height:1.6;}
  .hint code{background:var(--panel-hi);padding:1px 5px;border-radius:4px;color:var(--teal);}

  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .row.between{justify-content:space-between;}

  button{
    font-family:var(--font-body);
    font-size:14px;
    font-weight:600;
    padding:10px 18px;
    border-radius:8px;
    border:1px solid transparent;
    cursor:pointer;
    transition:transform .1s ease, opacity .15s ease;
  }
  button:active{transform:scale(.97);}
  button:disabled{opacity:.35;cursor:not-allowed;}

  .btn-primary{background:var(--amber);color:#FFFFFF;}
  .btn-primary:hover:not(:disabled){opacity:.9;}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--ink);}
  .btn-ghost:hover:not(:disabled){border-color:var(--amber-dim);}
  .btn-icon{
    background:var(--panel-hi);
    border-color:var(--line);
    color:var(--ink);
    width:44px;height:44px;
    border-radius:50%;
    font-size:17px;
    display:flex;align-items:center;justify-content:center;
    padding:0;
  }
  .btn-icon:hover:not(:disabled){border-color:var(--amber-dim);}
  .btn-mic{
    background:var(--panel-hi);
    border-color:var(--line);
    color:var(--ink);
    width:64px;height:64px;
    border-radius:50%;
    font-size:22px;
    display:flex;align-items:center;justify-content:center;
    padding:0;
  }
  .btn-mic.listening{
    background:var(--red);
    border-color:var(--red);
    color:#FFFFFF;
    box-shadow:0 0 0 6px rgba(217,80,63,0.14);
  }
  .btn-mic.speaking{
    background:var(--teal);
    border-color:var(--teal);
    color:#FFFFFF;
  }

  select{
    background:var(--panel-hi);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:6px;
    font-family:var(--font-mono);
    font-size:12px;
    padding:6px 8px;
  }

  #bankStatus{font-size:13px;color:var(--teal);margin-top:8px;min-height:18px;}

  .empty{
    text-align:center;
    padding:36px 12px;
    color:var(--ink-dim);
    font-size:14px;
  }

  .qbox{
    display:none;
  }
  .qmeta{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--ink-dim);
    letter-spacing:.08em;
    margin-bottom:10px;
  }
  .question-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
  }
  .question{
    font-family:var(--font-display);
    font-size:22px;
    line-height:1.5;
    color:var(--ink);
    margin-bottom:4px;
    flex:1;
  }

  .mic-area{
    display:flex;
    align-items:center;
    gap:18px;
    margin:20px 0 6px;
  }
  .waveform{
    display:flex;
    align-items:center;
    gap:3px;
    height:36px;
    flex:1;
  }
  .waveform span{
    display:block;
    width:4px;
    border-radius:2px;
    background:var(--line);
    height:6px;
    transition:height .1s ease, background .15s ease;
  }
  .waveform.active span{background:var(--red);}

  .mic-label{font-size:12px;color:var(--ink-dim);font-family:var(--font-mono);}

  #transcript{min-height:70px;margin-top:6px;}

  .stats{
    display:flex;
    gap:24px;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--ink-dim);
  }
  .stats b{color:var(--amber);font-size:16px;font-family:var(--font-body);}

  .warn{
    background:rgba(217,80,63,0.06);
    border:1px solid rgba(217,80,63,0.25);
    color:#A83E2F;
    font-size:12.5px;
    padding:10px 12px;
    border-radius:8px;
    margin-top:10px;
    line-height:1.6;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Oral Quiz Trainer</div>
    <h1>口语问答自测</h1>
    <div class="sub">粘贴你的题库 → 随机抽题，系统会语音播报题目 → 对着麦克风口头回答，练习你的表达。</div>
  </header>

  <!-- 题库导入 -->
  <div class="card">
    <h2><span class="n">01</span> 导入题库</h2>
    <textarea id="bankInput" rows="6" placeholder="每行一道题即可，例如：
Python 的 GIL 是什么？
什么是过拟合？
请介绍一下你自己

也支持粘贴 JSON 数组：[&quot;问题1&quot;, &quot;问题2&quot;, ...]"></textarea>
    <div class="row between" style="margin-top:10px;">
      <button class="btn-primary" id="loadBankBtn">加载题库</button>
      <select id="langSelect">
        <option value="zh-CN">中文</option>
        <option value="en-US">English</option>
      </select>
      <button class="btn-ghost" id="ttsToggleBtn">🔊 语音播报：开</button>
    </div>
    <div class="hint">每行一题即可，不需要填答案；也支持粘贴 JSON 字符串数组。</div>
    <div id="bankStatus"></div>
  </div>

  <!-- 抽题 & 作答 -->
  <div class="card">
    <h2><span class="n">02</span> 抽题作答</h2>

    <div class="empty" id="emptyState">先在上方加载题库，再来抽题。</div>

    <div class="qbox" id="qbox">
      <div class="row between">
        <div class="qmeta" id="qmeta">题库共 0 题</div>
        <div class="stats" id="statsBar"></div>
      </div>
      <div class="question-row">
        <div class="question" id="questionText"></div>
        <button class="btn-icon" id="replayBtn" title="重新播报题目">🔊</button>
      </div>
      <button class="btn-ghost" id="nextBtn" style="margin-top:10px;">🔀 换一题</button>

      <div class="mic-area">
        <button class="btn-mic" id="micBtn" title="按下开始/停止录音">🎤</button>
        <div class="waveform" id="waveform"></div>
      </div>
      <div class="mic-label" id="micLabel">题目播报完毕后，点击麦克风开始口语作答</div>

      <textarea id="transcript" rows="3" placeholder="你说的内容会实时转成文字显示在这里，仅供自己回顾，不会打分…"></textarea>

      <div id="speechWarn" class="warn" style="display:none;">
        当前浏览器不支持语音识别（建议使用 Chrome）。语音播报题目功能不受影响。
      </div>
    </div>
  </div>

</div>

<script>
let bank = [];
let currentIndex = -1;
let recognition = null;
let listening = false;
let waveformInterval = null;
let practiced = 0;
let drawnSet = new Set();
let ttsEnabled = true;

const $ = id => document.getElementById(id);

// ---------- 题库解析（只需要题目） ----------
function parseBank(raw) {
  raw = raw.trim();
  if (!raw) return [];
  if (raw.startsWith('[')) {
    try {
      const parsed = JSON.parse(raw);
      return parsed
        .map(item => (typeof item === 'string' ? item : (item.q || item.question || '')))
        .map(s => s.trim())
        .filter(Boolean);
    } catch (e) {
      // fall through to line parsing
    }
  }
  return raw.split('\n')
    .map(l => l.trim())
    // 兼容旧格式：如果某行还带着 "问题 | 答案"，只取问题部分
    .map(l => l.split('|')[0].trim())
    .filter(l => l.length > 0);
}

$('loadBankBtn').addEventListener('click', () => {
  const parsed = parseBank($('bankInput').value);
  if (parsed.length === 0) {
    $('bankStatus').textContent = '没有识别到有效题目，请检查格式。';
    $('bankStatus').style.color = 'var(--red)';
    return;
  }
  bank = parsed;
  practiced = 0;
  drawnSet = new Set();
  $('bankStatus').textContent = `已加载 ${bank.length} 道题目 ✓`;
  $('bankStatus').style.color = 'var(--teal)';
  $('emptyState').style.display = 'none';
  $('qbox').style.display = 'block';
  drawQuestion();
});

// ---------- 抽题 ----------
function drawQuestion() {
  if (bank.length === 0) return;
  let idx = Math.floor(Math.random() * bank.length);
  if (bank.length > 1) {
    while (idx === currentIndex) idx = Math.floor(Math.random() * bank.length);
  }
  currentIndex = idx;
  drawnSet.add(idx);
  practiced += 1;
  $('questionText').textContent = bank[idx];
  $('qmeta').textContent = `题库共 ${bank.length} 题`;
  $('transcript').value = '';
  updateStats();
  stopListening();
  speakQuestion(bank[idx]);
}
$('nextBtn').addEventListener('click', drawQuestion);

$('ttsToggleBtn').addEventListener('click', () => {
  ttsEnabled = !ttsEnabled;
  $('ttsToggleBtn').textContent = ttsEnabled ? '🔊 语音播报：开' : '🔇 语音播报：关';
  if (!ttsEnabled && 'speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    $('micBtn').disabled = false;
    $('replayBtn').classList.remove('speaking');
    $('micLabel').textContent = '语音播报已关闭 · 点击麦克风开始口语作答';
  }
});
$('replayBtn').addEventListener('click', () => {
  if (currentIndex >= 0) speakQuestion(bank[currentIndex]);
});

function updateStats() {
  $('statsBar').innerHTML = `<span><b>${practiced}</b> 已抽题</span><span><b>${drawnSet.size}</b> 已覆盖 / ${bank.length}</span>`;
}

// ---------- 语音播报（TTS，优先选女声） ----------
let voicesCache = [];
function loadVoices() {
  voicesCache = window.speechSynthesis.getVoices();
}
if ('speechSynthesis' in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function pickFemaleVoice(lang) {
  const prefix = lang.split('-')[0].toLowerCase();
  const candidates = voicesCache.filter(v => v.lang && v.lang.toLowerCase().startsWith(prefix));
  const femaleHint = /female|女声|婷婷|晓晓|晓伊|瑶瑶|慧慧|静|Ting-?Ting|Mei-?Jia|Xiaoxiao|Yaoyao|Huihui|Zira|Samantha|Susan|Karen|Moira|Tessa|Fiona|Google.*(US|UK|普通话|國語).*Female/i;
  return candidates.find(v => femaleHint.test(v.name)) || candidates[0] || null;
}

function speakQuestion(text) {
  if (!ttsEnabled) {
    $('micLabel').textContent = '语音播报已关闭 · 点击麦克风开始口语作答';
    return;
  }
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = $('langSelect').value;
  const voice = pickFemaleVoice(utter.lang);
  if (voice) utter.voice = voice;
  utter.pitch = 1.05;
  utter.rate = 0.8;
  $('micBtn').disabled = true;
  $('replayBtn').classList.add('speaking');
  $('micLabel').textContent = '🔊 正在播报题目…';
  utter.onend = () => {
    $('micBtn').disabled = false;
    $('replayBtn').classList.remove('speaking');
    $('micLabel').textContent = '点击麦克风开始口语作答';
  };
  utter.onerror = () => {
    $('micBtn').disabled = false;
    $('replayBtn').classList.remove('speaking');
    $('micLabel').textContent = '点击麦克风开始口语作答';
  };
  window.speechSynthesis.speak(utter);
}

// ---------- 语音识别（听写作答） ----------
const waveEl = $('waveform');
for (let i = 0; i < 28; i++) {
  const bar = document.createElement('span');
  waveEl.appendChild(bar);
}

function setupRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    $('speechWarn').style.display = 'block';
    $('micBtn').disabled = true;
    return;
  }
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = $('langSelect').value;

  recognition.onresult = (event) => {
    let finalText = '';
    let interimText = '';
    for (let i = 0; i < event.results.length; i++) {
      const t = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalText += t;
      else interimText += t;
    }
    $('transcript').value = (finalText + ' ' + interimText).trim();
  };
  recognition.onerror = (e) => {
    $('micLabel').textContent = '识别出错（' + e.error + '）';
    stopListening();
  };
  recognition.onend = () => {
    if (listening) {
      try { recognition.start(); } catch (e) { stopListening(); }
    }
  };
}
setupRecognition();
$('langSelect').addEventListener('change', () => {
  if (recognition) recognition.lang = $('langSelect').value;
});

function startListening() {
  if (!recognition) return;
  listening = true;
  $('micBtn').classList.add('listening');
  $('micBtn').textContent = '⏹';
  $('micLabel').textContent = '正在聆听… 再次点击停止';
  waveEl.classList.add('active');
  waveformInterval = setInterval(() => {
    waveEl.querySelectorAll('span').forEach(s => {
      s.style.height = (listening ? (4 + Math.random() * 28) : 6) + 'px';
    });
  }, 120);
  try { recognition.start(); } catch (e) {}
}
function stopListening() {
  listening = false;
  $('micBtn').classList.remove('listening');
  $('micBtn').textContent = '🎤';
  waveEl.classList.remove('active');
  clearInterval(waveformInterval);
  waveEl.querySelectorAll('span').forEach(s => s.style.height = '6px');
  if (recognition) { try { recognition.stop(); } catch (e) {} }
}
$('micBtn').addEventListener('click', () => {
  if (listening) stopListening(); else startListening();
});
</script>
</body>
</html>
